name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (API + web)
        run: npm run build

      # Boot the built server exactly as production does, on an empty DB, and
      # require /api/health (which queries the DB) to answer 200. Catches boot-order
      # bugs like DDL running before migrations ("no such table" on a fresh DB).
      - name: Boot smoke test (fresh DB)
        run: |
          NODE_ENV=production DATABASE_PATH="$RUNNER_TEMP/smoke.db" \
            node packages/api/dist/server.js > "$RUNNER_TEMP/smoke.log" 2>&1 &
          SERVER_PID=$!
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:3001/api/health; then
              echo
              echo "Server booted on a fresh DB; /api/health returned 200."
              kill "$SERVER_PID"
              wait "$SERVER_PID" || true
              exit 0
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::Server exited during boot on a fresh DB"
              cat "$RUNNER_TEMP/smoke.log"
              exit 1
            fi
            sleep 1
          done
          echo "::error::/api/health did not return 200 within 30s"
          cat "$RUNNER_TEMP/smoke.log"
          kill "$SERVER_PID" || true
          exit 1

      - name: Run API unit tests
        run: npm run test:run -w packages/api
