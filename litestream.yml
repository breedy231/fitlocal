# How long the final sync to R2 keeps retrying after node exits (0.5.x default: 30s).
# Keep it below fly.toml's kill_timeout (30s) minus node's shutdown time, so the
# sync finishes before Fly's follow-up SIGTERM interrupts it.
shutdown-sync-timeout: 20s

dbs:
  - path: ${DATABASE_PATH}
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: fitlocal
        endpoint: https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
        access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
        secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
        force-path-style: true
        sync-interval: 1s
