app = "fitlocal-app"

# Shutdown (deploys, `fly machine stop`, auto_stop_machines idle stops): Fly sends
# kill_signal to PID 1 (Litestream), which forwards it to node, waits for node to
# exit, then does a final WAL sync to R2 (bounded by shutdown-sync-timeout: 20s in
# litestream.yml). Fly's default window is 5s, which that final sync could miss.
# After kill_timeout Fly signals again, and Litestream abandons the sync.
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "packages/api/Dockerfile"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
