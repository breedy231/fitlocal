app = "fitlocal-app"

# Shutdown (deploys, restarts, auto_stop): Fly sends kill_signal to PID 1, which is
# Litestream (scripts/docker-entrypoint.sh). Litestream forwards it to node, waits
# for node to exit, then does a final WAL sync to R2, capped by
# shutdown-sync-timeout in litestream.yml. When kill_timeout runs out, Fly sends
# SIGTERM again and Litestream abandons that sync. With Fly's defaults (SIGINT, 5s),
# node's own shutdown uses up the whole window and the final sync is skipped.
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "packages/api/Dockerfile"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
